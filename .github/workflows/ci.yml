name: Native tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install runtime
        run: sudo apt-get update && sudo apt-get install -y gnucobol python3 make
      - name: Run native tests
        run: |
          make test
